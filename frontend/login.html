<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RedPoint Sports Portal Login">
  <title>Login — RedPoint Sports Management</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-brand">
        <i class="bi bi-circle-fill"></i>
        <span>RedPoint</span>
      </div>
      <div class="auth-subtitle">Sports & Extracurricular Event Portal</div>
    </div>

    <div class="auth-body">
      <!-- Error / Alert Message Box -->
      <div id="login-alert" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="login-email" class="form-label small fw-semibold text-secondary">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="login-email" placeholder="name@college.edu" required autocomplete="email">
          </div>
        </div>

        <div class="mb-4">
          <label for="login-password" class="form-label small fw-semibold text-secondary">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-shield-lock"></i></span>
            <input type="password" class="form-control" id="login-password" placeholder="••••••••" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
          <span id="btn-text"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In</span>
          <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
        </button>
      </form>

      <!-- Quick Fill Helper for Demo & Viva -->
      <div class="border-top pt-3 text-center">
        <div class="small text-muted mb-2">Quick Academic Demo Logins:</div>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-outline-danger btn-sm flex-fill" onclick="quickFill('admin@redpoint.com', 'admin123')">
            <i class="bi bi-person-fill-gear me-1"></i> Admin Demo
          </button>
          <button type="button" class="btn btn-outline-primary btn-sm flex-fill" onclick="quickFill('arun.kumar@college.edu', 'student123')">
            <i class="bi bi-person-fill me-1"></i> Student Demo
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Redirect if already logged in
    document.addEventListener('DOMContentLoaded', () => {
      window.RedPointAuth.redirectIfLoggedIn();
    });

    function quickFill(email, password) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = password;
    }

    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('login-alert');
    const submitBtn = document.getElementById('login-submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('d-none');
      alertBox.textContent = '';

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        alertBox.textContent = 'Please enter both email and password.';
        alertBox.classList.remove('d-none');
        return;
      }

      // UI loading state
      submitBtn.disabled = true;
      btnText.classList.add('d-none');
      btnSpinner.classList.remove('d-none');

      try {
        const response = await window.RedPointAPI.auth.login(email, password);
        window.RedPointAuth.saveAuth(response.token, response.user);

        // Redirect based on role
        if (response.user.role === 'ADMIN') {
          window.location.href = '/admin/dashboard.html';
        } else {
          window.location.href = '/participant/dashboard.html';
        }
      } catch (err) {
        alertBox.textContent = err.message || 'Invalid email or password.';
        alertBox.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        btnText.classList.remove('d-none');
        btnSpinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
